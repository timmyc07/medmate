name: 喚醒網站服務

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: medmate-keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm run keep-alive:once
        env:
          KEEP_ALIVE_URL: ${{ vars.KEEP_ALIVE_URL || 'https://medmate-53s1.onrender.com/api/health' }}
